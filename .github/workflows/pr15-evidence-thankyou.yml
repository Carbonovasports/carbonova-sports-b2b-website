name: PR15 evidence safety and thank-you conversion

on:
  push:
    branches:
      - seo/pr15-evidence-thankyou

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/pr15-evidence-thankyou
          fetch-depth: 0

      - name: Apply scoped text-only changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 match, found {count}: {old[:100]}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # products.html: remove blanket approval wording while preserving product cards/layout.
          replace_once('products.html',
              'Titanium texture face on a PP honeycomb core with cushioned grip - stable structure and consistent feel, USA Pickleball approved.',
              'Titanium texture face on a PP honeycomb core with cushioned grip - stable structure and consistent feel for OEM and private-label development.')
          replace_once('products.html',
              '<li>USA Pickleball approved</li></ul><a class="btn btn-dark" href="product-titanium.html">',
              '<li>Approval is model-specific; verify the exact finished model before marketing</li></ul><a class="btn btn-dark" href="product-titanium.html">')
          replace_once('products.html',
              '<li>USA Pickleball approved</li></ul><a class="btn btn-dark" href="product-kevlar.html">',
              '<li>Approval is model-specific; verify the exact finished model before marketing</li></ul><a class="btn btn-dark" href="product-kevlar.html">')

          # Titanium detail page: make every approval statement explicitly model-specific.
          replace_once('product-titanium.html',
              'Carbonova Titanium pickleball paddle with titanium texture surface, PP honeycomb core and cushioned grip - USA Pickleball approved for training and competition.',
              'Carbonova Titanium pickleball paddle with titanium texture surface, PP honeycomb core and cushioned grip for OEM/private-label development; approval must be verified for the exact finished model.')
          replace_once('product-titanium.html',
              'Carbonova Titanium pickleball paddle with titanium texture surface, PP honeycomb core and cushioned grip - USA Pickleball approved for training and competition.',
              'Carbonova Titanium pickleball paddle with titanium texture surface, PP honeycomb core and cushioned grip for OEM/private-label development; approval must be verified for the exact finished model.')
          replace_once('product-titanium.html',
              'Carbonova Titanium pickleball paddle with titanium texture surface, PP honeycomb core and cushioned grip - USA Pickleball approved for training and competition.',
              'Carbonova Titanium pickleball paddle with titanium texture surface, PP honeycomb core and cushioned grip for OEM/private-label development; approval must be verified for the exact finished model.')
          replace_once('product-titanium.html',
              'Carbonova TITANIUM series - titanium texture surface on a PP honeycomb core with cushioned grip. USA Pickleball approved for tournament play.',
              'Carbonova TITANIUM series - titanium texture surface on a PP honeycomb core with cushioned grip. USA Pickleball approval is model-specific and must be verified for the exact finished model.')
          replace_once('product-titanium.html',
              'data-alt="Carbonova Titanium pickleball paddle with titanium texture and USA Pickleball approved"',
              'data-alt="Carbonova Titanium pickleball paddle with titanium texture surface and PP honeycomb core"')
          replace_once('product-titanium.html',
              '<li>USA Pickleball Approved (official for tournament play)</li>',
              '<li>USA Pickleball approval is model-specific; verify the exact finished model</li>')
          replace_once('product-titanium.html',
              '<tr><th>Certification</th><td>USA Pickleball Approved (official for tournament play)</td></tr>',
              '<tr><th>Certification</th><td>Model-specific — verify the exact finished model on the official USA Pickleball list before marketing</td></tr>')
          replace_once('product-titanium.html',
              'USA Pickleball Approved &mdash; View Official Listing &rarr;',
              'Verify Exact Model on the Official USA Pickleball List &rarr;')
          replace_once('product-titanium.html',
              '<span class="kicker">Consistent Feel</span><h3>Tournament-ready</h3><p>Even response across the hitting surface, USA Pickleball approved for official play.</p>',
              '<span class="kicker">Consistent Feel</span><h3>Competition-oriented</h3><p>Even response across the hitting surface. For tournament marketing, verify the exact finished model\'s current approval status.</p>')

          # Aramid/Kevlar detail page: remove blanket approval and tournament-ready wording.
          replace_once('product-kevlar.html',
              'data-alt="Kevlar paddle specifications: PP honeycomb, Kevlar surface, thermoformed, 16 mm, elongated, USA Pickleball approved"',
              'data-alt="Kevlar paddle specifications: PP honeycomb, aramid fiber surface, thermoformed, 16 mm, elongated"')
          replace_once('product-kevlar.html',
              '<h2 style="font-size:42px;line-height:1.1">Exceptional spin. Consistent feel. Tournament-ready.</h2>',
              '<h2 style="font-size:42px;line-height:1.1">Exceptional spin. Consistent feel. Performance-oriented.</h2>')
          replace_once('product-kevlar.html',
              '<li>USA Pickleball Approved</li>',
              '<li>USA Pickleball approval is model-specific; verify the exact finished model</li>')
          replace_once('product-kevlar.html',
              '<tr><th>Certification</th><td>USA Pickleball Approved</td></tr>',
              '<tr><th>Certification</th><td>Model-specific — verify the exact finished model on the official USA Pickleball list before marketing</td></tr>')
          replace_once('product-kevlar.html',
              'USA Pickleball Approved &mdash; View Official Listing &rarr;',
              'Verify Exact Model on the Official USA Pickleball List &rarr;')

          # Thank-you page: give high-intent buyers three useful next steps using existing styles only.
          replace_once('thank-you.html',
              '<main class="page-hero"><div class="container"><span class="breadcrumbs">Home / Thank You</span><h1>Thank You for Your RFQ</h1><p>Your project request has been received. Carbonova Sports will review your requirements and reply within 1 business day.</p><p><a class="btn btn-primary" href="index.html">Back to Home</a></p></div></main>',
              '<main class="page-hero"><div class="container"><span class="breadcrumbs">Home / Thank You</span><h1>Thank You for Your RFQ</h1><p>Your project request has been received. Carbonova Sports will review your requirements and reply within 1 business day.</p><p><strong>While we review your project, choose the next step that is most useful:</strong></p><p><a class="btn btn-primary" href="https://wa.me/8615980790858?text=Hi%20Carbonova%2C%20I%20just%20submitted%20an%20RFQ%20and%20would%20like%20to%20continue%20on%20WhatsApp." target="_blank" rel="noopener">Chat on WhatsApp</a> <a class="btn btn-dark" href="factory.html">View Factory &amp; Quality Proof</a> <a class="btn btn-outline" href="oem.html">Review OEM / ODM Process</a></p><p><a class="more" href="quality.html">Quality &amp; certifications</a> · <a class="more" href="case-studies.html">Representative OEM programs</a></p></div></main>')
          PY

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/pr15-evidence-thankyou.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.html product-titanium.html product-kevlar.html thank-you.html .github/workflows/pr15-evidence-thankyou.yml
          git commit -m "SEO safety: model-specific approval wording and RFQ next steps"
          git push origin HEAD:seo/pr15-evidence-thankyou
