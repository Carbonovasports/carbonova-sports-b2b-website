name: One-time P2 image performance optimization

on:
  push:
    branches:
      - seo/p2-performance-images

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/p2-performance-images
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Optimize critical images and image markup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import os, re

          root = Path('.')
          img_root = root / 'assets' / 'img'

          # 1) Convert the oversized homepage LCP banner to WebP.
          hero_png = img_root / 'hero-banner-green.png'
          hero_webp = img_root / 'hero-banner-green.webp'
          if hero_png.exists():
              with Image.open(hero_png) as im:
                  if im.mode not in ('RGB', 'RGBA'):
                      im = im.convert('RGBA' if 'A' in im.getbands() else 'RGB')
                  im.save(hero_webp, 'WEBP', quality=88, method=6)
              # Keep WebP only when it provides a meaningful saving.
              if hero_webp.stat().st_size >= hero_png.stat().st_size * 0.90:
                  hero_webp.unlink()

          # 2) Convert the unusually large AEROSOUL reference image used on T700 page.
          aero_jpg = img_root / 'carbonova-aerosoul-6.0.jpg'
          aero_webp = img_root / 'carbonova-aerosoul-6.0.webp'
          if aero_jpg.exists():
              with Image.open(aero_jpg) as im:
                  im.convert('RGB').save(aero_webp, 'WEBP', quality=84, method=6)
              if aero_webp.stat().st_size >= aero_jpg.stat().st_size * 0.90:
                  aero_webp.unlink()

          target_files = [
              'index.html','products.html','padel.html','technology.html','factory.html','quality.html',
              'product-custom.html','product-gen5-foam-core.html','product-kevlar.html',
              'product-padel-custom-lime.html','product-padel-diamond-gold.html','product-padel-orange.html',
              'product-padel-pink.html','product-padel-round-teal.html','product-pp-honeycomb.html',
              'product-t700.html','product-thermoformed.html','product-titanium.html'
          ]

          src_re = re.compile(r'\bsrc=(['\"'])(.*?)\1', re.I)
          width_re = re.compile(r'\bwidth=(['\"']).*?\1', re.I)
          height_re = re.compile(r'\bheight=(['\"']).*?\1', re.I)
          loading_re = re.compile(r'\bloading=(['\"']).*?\1', re.I)
          decoding_re = re.compile(r'\bdecoding=(['\"']).*?\1', re.I)
          priority_re = re.compile(r'\bfetchpriority=(['\"']).*?\1', re.I)
          img_tag_re = re.compile(r'<img\b[^>]*>', re.I)

          def local_image_path(html_path, src):
              if src.startswith(('http://','https://','data:','//')):
                  return None
              clean = src.split('?',1)[0].split('#',1)[0]
              p = (html_path.parent / clean).resolve()
              try:
                  p.relative_to(root.resolve())
              except ValueError:
                  return None
              return p if p.exists() and p.is_file() else None

          def add_attr(tag, attr, value):
              # Insert before the closing > while preserving the original line/format.
              return tag[:-1] + f' {attr}="{value}">'

          for rel in target_files:
              html_path = root / rel
              if not html_path.exists():
                  continue
              text = html_path.read_text(encoding='utf-8')

              # Switch only the selected heavy assets when WebP was retained.
              if rel == 'index.html' and hero_webp.exists():
                  text = text.replace('assets/img/hero-banner-green.png', 'assets/img/hero-banner-green.webp')
                  if 'rel="preload" as="image" href="assets/img/hero-banner-green.webp"' not in text:
                      marker = '<link rel="stylesheet" href="assets/css/styles.css">'
                      preload = '<link rel="preload" as="image" href="assets/img/hero-banner-green.webp" type="image/webp" fetchpriority="high">\n  '
                      text = text.replace(marker, preload + marker, 1)
              if rel == 'product-t700.html' and aero_webp.exists():
                  text = text.replace('assets/img/carbonova-aerosoul-6.0.jpg', 'assets/img/carbonova-aerosoul-6.0.webp')

              def tune(match):
                  tag = match.group(0)
                  sm = src_re.search(tag)
                  if not sm:
                      return tag
                  src = sm.group(2)
                  p = local_image_path(html_path, src)
                  if not p:
                      return tag

                  ext = p.suffix.lower()
                  is_svg = ext == '.svg'
                  is_hero = 'hero-banner-img' in tag
                  is_product_main = 'id="gallery-main-img"' in tag or "id='gallery-main-img'" in tag
                  is_header_logo = 'logo.svg' in src and 'site-header' not in tag  # dimensions already usually present

                  if not is_svg and (not width_re.search(tag) or not height_re.search(tag)):
                      try:
                          with Image.open(p) as im:
                              w,h = im.size
                          if not width_re.search(tag): tag = add_attr(tag,'width',w)
                          if not height_re.search(tag): tag = add_attr(tag,'height',h)
                      except Exception:
                          pass

                  if not is_svg and not decoding_re.search(tag):
                      tag = add_attr(tag,'decoding','async')

                  if is_hero or is_product_main:
                      if not loading_re.search(tag): tag = add_attr(tag,'loading','eager')
                      if not priority_re.search(tag): tag = add_attr(tag,'fetchpriority','high')
                  elif not is_svg:
                      if not loading_re.search(tag): tag = add_attr(tag,'loading','lazy')
                      # Do not add fetchpriority=low statically; lazy-loading is sufficient and broadly supported.
                  return tag

              text = img_tag_re.sub(tune, text)
              html_path.write_text(text, encoding='utf-8')

          # Remove the temporary runtime-wide fetchpriority=low behavior; static HTML now carries the important hints.
          js = root / 'assets/js/main.js'
          if js.exists():
              txt = js.read_text(encoding='utf-8')
              block_start = txt.find('(function(){\n  var hero=document.querySelector(\'.hero-banner-img\');')
              if block_start != -1:
                  block_end = txt.find('})();', block_start)
                  if block_end != -1:
                      txt = txt[:block_start] + txt[block_end+5:]
                      js.write_text(txt.rstrip()+'\n', encoding='utf-8')

          # Self-remove this one-time workflow from the resulting branch.
          wf = root / '.github/workflows/p2-performance-once.yml'
          if wf.exists():
              wf.unlink()
          PY

      - name: Validate critical performance markup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          idx=Path('index.html').read_text(encoding='utf-8')
          assert 'class="hero-banner-img"' in idx
          assert 'fetchpriority="high"' in idx
          assert 'loading="eager"' in idx
          assert 'width="1920"' in idx and 'height="1080"' in idx
          # Ensure selected product main galleries remain eager/high priority.
          for f in ['product-t700.html','product-kevlar.html','product-gen5-foam-core.html','product-padel-round-teal.html']:
              t=Path(f).read_text(encoding='utf-8')
              m=re.search(r'<img[^>]*id="gallery-main-img"[^>]*>',t)
              assert m and 'loading="eager"' in m.group(0) and 'fetchpriority="high"' in m.group(0), f
          print('P2 image markup validation passed')
          PY

      - name: Commit P2 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: optimize LCP image and responsive image loading" || exit 0
          git push origin seo/p2-performance-images
