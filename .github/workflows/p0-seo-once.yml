name: One-time P0 SEO consistency update

on:
  push:
    branches:
      - codex/p0-seo-consistency

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/p0-seo-consistency
          fetch-depth: 0

      - name: Apply P0 SEO changes
        shell: python
        run: |
          from pathlib import Path
          import re, json

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Expected text not found for {label}')
              return text.replace(old, new, 1)

          # index.html: keep body/visuals unchanged; align OG + consolidate Organization JSON-LD.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = replace_once(
              s,
              '<meta property="og:description" content="Carbonova Sports manufactures T700 carbon fiber, thermoformed and custom private label pickleball paddles for brands, distributors and sports companies.">',
              '<meta property="og:description" content="Carbonova Sports manufactures carbon fiber pickleball paddles and padel rackets for global brands, distributors and sports companies, with OEM, ODM and private label development.">',
              'index OG description'
          )

          org_pattern = re.compile(
              r'\s*<script type="application/ld\+json">\{"@context": "https://schema.org", "@type": "Organization".*?</script>\s*'
              r'<script type="application/ld\+json">\{"@context":"https://schema.org","@type":"Organization".*?</script>',
              re.S
          )
          m = org_pattern.search(s)
          if not m:
              raise SystemExit('Expected duplicate homepage Organization schemas not found')
          org = {
              "@context": "https://schema.org",
              "@type": "Organization",
              "name": "Carbonova Sports",
              "legalName": "Xiamen Carbon Rock Material Technology Co., Ltd.",
              "alternateName": "Xiamen Carbon Rock Material Technology Co., Ltd.",
              "url": "https://www.carbonovasports.com/",
              "logo": "https://www.carbonovasports.com/assets/img/logo.svg",
              "description": "B2B manufacturer of pickleball paddles and padel rackets with OEM, ODM and private label development for global brands, distributors and sports companies.",
              "email": "sales@carbonovasports.com",
              "telephone": "+86 18959233167",
              "address": {
                  "@type": "PostalAddress",
                  "addressLocality": "Xiamen",
                  "addressRegion": "Fujian",
                  "addressCountry": "CN"
              },
              "hasCertification": [
                  {
                      "@type": "Certification",
                      "name": "ISO 9001:2015 Quality Management System",
                      "certificationIdentification": "25CN34517594Q",
                      "issuedBy": {"@type": "Organization", "name": "ACM International Certification Limited"},
                      "validFrom": "2025-07-10",
                      "validUntil": "2028-07-09"
                  },
                  {
                      "@type": "Certification",
                      "name": "CE Verification of Conformity (GPSR (EU) 2023/988, EN 1509:2008)",
                      "certificationIdentification": "ICR/VC/HM250954",
                      "issuedBy": {"@type": "Organization", "name": "ICR"},
                      "validFrom": "2025-09-05",
                      "validUntil": "2030-09-04"
                  },
                  {
                      "@type": "Certification",
                      "name": "amfori BSCI Social Audit",
                      "certificationIdentification": "amfori ID 156-062937-000 (SGS monitoring 26-043253)",
                      "issuedBy": {"@type": "Organization", "name": "SGS"},
                      "validFrom": "2026-06-17",
                      "validUntil": "2027-06-17"
                  },
                  {
                      "@type": "Certification",
                      "name": "USA Pickleball Paddle Certification Testing",
                      "certificationIdentification": "USA Pickleball Paddle Certification Test Standard July 2020 R0 - element report compliant",
                      "issuedBy": {"@type": "Organization", "name": "element"}
                  }
              ]
          }
          merged = '\n  <script type="application/ld+json">' + json.dumps(org, ensure_ascii=False, separators=(',', ':')) + '</script>'
          s = s[:m.start()] + merged + s[m.end():]
          p.write_text(s, encoding='utf-8')

          # technology.html
          p = Path('technology.html')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s,
              '<title>Pickleball Paddle Technology & Materials | Carbonova Sports</title>',
              '<title>Pickleball &amp; Padel Racket Technology | Carbon Fiber, EVA &amp; OEM | Carbonova</title>',
              'technology title')
          s = replace_once(s,
              '<meta name="description" content="Compare T700, 3K, 12K, 18K carbon, fiberglass, thermoformed construction, core thickness and other pickleball paddle options.">',
              '<meta name="description" content="Explore pickleball and padel racket technology including T700, 3K/12K/18K carbon, fiberglass, thermoformed structures, EVA cores, shapes, balance and OEM development.">',
              'technology meta')
          s = replace_once(s,
              '<meta property="og:title" content="Pickleball Paddle Technology & Materials | Carbonova Sports">',
              '<meta property="og:title" content="Pickleball &amp; Padel Racket Technology | Carbon Fiber, EVA &amp; OEM | Carbonova">',
              'technology OG title')
          s = replace_once(s,
              '<meta property="og:description" content="Compare T700, 3K, 12K, 18K carbon, fiberglass, thermoformed construction, core thickness and other pickleball paddle options.">',
              '<meta property="og:description" content="Explore pickleball and padel racket technology including carbon materials, thermoformed structures, EVA cores, shapes, balance and OEM development.">',
              'technology OG description')
          p.write_text(s, encoding='utf-8')

          # oem.html
          p = Path('oem.html')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s,
              '<title>OEM Pickleball Paddle Manufacturer | Private Label | Carbonova Sports</title>',
              '<title>Pickleball &amp; Padel OEM/ODM Manufacturer | Private Label | Carbonova</title>',
              'OEM title')
          s = replace_once(s,
              '<meta name="description" content="OEM and private label pickleball paddle development from design and prototype to quality-controlled mass production.">',
              '<meta name="description" content="OEM/ODM and private label development for pickleball paddles and padel rackets, from specification and prototype to quality-controlled mass production and delivery.">',
              'OEM meta')
          s = replace_once(s,
              '<meta property="og:title" content="OEM Pickleball Paddle Manufacturer | Private Label | Carbonova Sports">',
              '<meta property="og:title" content="Pickleball &amp; Padel OEM/ODM Manufacturer | Private Label | Carbonova">',
              'OEM OG title')
          s = replace_once(s,
              '<meta property="og:description" content="OEM and private label pickleball paddle development from design and prototype to quality-controlled mass production.">',
              '<meta property="og:description" content="OEM/ODM and private label development for pickleball paddles and padel rackets, from specification and prototype to controlled production and delivery.">',
              'OEM OG description')
          p.write_text(s, encoding='utf-8')

          # contact.html
          p = Path('contact.html')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s,
              '<title>Contact Carbonova Sports | Request Pickleball Paddle Quote</title>',
              '<title>Request Pickleball &amp; Padel OEM Quote | Carbonova Sports</title>',
              'contact title')
          s = replace_once(s,
              '<meta name="description" content="Send an RFQ for custom T700, thermoformed, fiberglass or private label pickleball paddles.">',
              '<meta name="description" content="Request an OEM/ODM quotation for custom pickleball paddles or padel rackets, including carbon materials, EVA cores, private label branding and packaging.">',
              'contact meta')
          s = replace_once(s,
              '<meta property="og:title" content="Contact Carbonova Sports | Request Pickleball Paddle Quote">',
              '<meta property="og:title" content="Request Pickleball &amp; Padel OEM Quote | Carbonova Sports">',
              'contact OG title')
          s = replace_once(s,
              '<meta property="og:description" content="Send an RFQ for custom T700, thermoformed, fiberglass or private label pickleball paddles.">',
              '<meta property="og:description" content="Request an OEM/ODM quotation for custom pickleball paddles or padel rackets with private label branding, materials and packaging options.">',
              'contact OG description')
          p.write_text(s, encoding='utf-8')

          # Canonicals are intentionally left unchanged after verification.

          # Remove this one-time workflow so the PR contains only the four target HTML files.
          Path('.github/workflows/p0-seo-once.yml').unlink()

      - name: Verify scope and commit
        run: |
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="contact.html
          index.html
          oem.html
          technology.html"
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected changed files:"
            echo "$changed"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html technology.html oem.html contact.html .github/workflows/p0-seo-once.yml
          git commit -m "P0 SEO consistency: dual-category metadata and Organization schema cleanup"
          git push origin HEAD:codex/p0-seo-consistency
