name: One-time P1 structured data and site consistency update

on:
  push:
    branches:
      - seo/p1-structured-data

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/p1-structured-data
          fetch-depth: 0
      - name: Apply P1 SEO updates
        shell: python
        run: |
          import html, json, re
          from pathlib import Path

          ROOT = Path('.')
          DOMAIN = 'https://www.carbonovasports.com/'
          MANUFACTURER = 'Xiamen Carbon Rock Material Technology Co., Ltd.'
          BRAND = 'Carbonova Sports'

          product_files = sorted(ROOT.glob('product-*.html'))
          blog_files = sorted((ROOT / 'blog').glob('*.html'))
          root_html = sorted(ROOT.glob('*.html'))

          def extract(pattern, text, flags=re.I|re.S):
              m = re.search(pattern, text, flags)
              return html.unescape(m.group(1).strip()) if m else ''

          def strip_tags(s):
              return re.sub(r'<[^>]+>', '', s).strip()

          def json_script(obj):
              return '<script type="application/ld+json">' + json.dumps(obj, ensure_ascii=False, separators=(',', ':')) + '</script>'

          def inject_before_head_close(text, block):
              if '</head>' in text:
                  return text.replace('</head>', block + '\n</head>', 1)
              return text

          # 1) Product + Breadcrumb structured data for all active product detail pages.
          for p in product_files:
              text = p.read_text(encoding='utf-8')
              canonical = extract(r'<link\s+rel="canonical"\s+href="([^"]+)"', text)
              title = extract(r'<title>(.*?)</title>', text)
              desc = extract(r'<meta\s+name="description"\s+content="([^"]*)"', text)
              h1 = strip_tags(extract(r'<h1[^>]*>(.*?)</h1>', text)) or title
              image_rel = extract(r'<div class="gallery-main">.*?<img[^>]+src="([^"]+)"', text)
              if not image_rel:
                  image_rel = extract(r'<meta\s+property="og:image"\s+content="([^"]+)"', text)
              if image_rel.startswith('http'):
                  image_url = image_rel
              else:
                  image_url = DOMAIN + image_rel.lstrip('./')
              is_padel = p.name.startswith('product-padel-')
              category_name = 'Padel Rackets' if is_padel else 'Pickleball Paddles'
              category_url = DOMAIN + ('padel.html' if is_padel else 'products.html')
              product = {
                  '@context': 'https://schema.org',
                  '@type': 'Product',
                  'name': h1,
                  'description': desc,
                  'url': canonical or DOMAIN + p.name,
                  'image': [image_url] if image_url else [],
                  'category': 'Padel Racket' if is_padel else 'Pickleball Paddle',
                  'brand': {'@type': 'Brand', 'name': BRAND},
                  'manufacturer': {'@type': 'Organization', 'name': MANUFACTURER, 'url': DOMAIN}
              }
              breadcrumb = {
                  '@context': 'https://schema.org',
                  '@type': 'BreadcrumbList',
                  'itemListElement': [
                      {'@type': 'ListItem', 'position': 1, 'name': 'Home', 'item': DOMAIN},
                      {'@type': 'ListItem', 'position': 2, 'name': category_name, 'item': category_url},
                      {'@type': 'ListItem', 'position': 3, 'name': h1, 'item': canonical or DOMAIN + p.name}
                  ]
              }
              # Avoid duplicate Product/Breadcrumb schemas if future edits already added them.
              if '"@type":"Product"' not in text and '"@type": "Product"' not in text:
                  text = inject_before_head_close(text, '\n  ' + json_script(product))
              if '"@type":"BreadcrumbList"' not in text and '"@type": "BreadcrumbList"' not in text:
                  text = inject_before_head_close(text, '\n  ' + json_script(breadcrumb))
              p.write_text(text, encoding='utf-8')

          # 2) Blog Breadcrumb + BlogPosting where absent. Do not invent dates.
          for p in blog_files:
              text = p.read_text(encoding='utf-8')
              canonical = extract(r'<link\s+rel="canonical"\s+href="([^"]+)"', text)
              title = extract(r'<title>(.*?)</title>', text)
              desc = extract(r'<meta\s+name="description"\s+content="([^"]*)"', text)
              h1 = strip_tags(extract(r'<h1[^>]*>(.*?)</h1>', text)) or title
              og_image = extract(r'<meta\s+property="og:image"\s+content="([^"]+)"', text)
              breadcrumb = {
                  '@context': 'https://schema.org',
                  '@type': 'BreadcrumbList',
                  'itemListElement': [
                      {'@type': 'ListItem', 'position': 1, 'name': 'Home', 'item': DOMAIN},
                      {'@type': 'ListItem', 'position': 2, 'name': 'Resources', 'item': DOMAIN + 'blog.html'},
                      {'@type': 'ListItem', 'position': 3, 'name': h1, 'item': canonical or DOMAIN + 'blog/' + p.name}
                  ]
              }
              if '"@type":"BreadcrumbList"' not in text and '"@type": "BreadcrumbList"' not in text:
                  text = inject_before_head_close(text, '\n  ' + json_script(breadcrumb))
              if ('"@type":"BlogPosting"' not in text and '"@type": "BlogPosting"' not in text and
                  '"@type":"Article"' not in text and '"@type": "Article"' not in text):
                  article = {
                      '@context': 'https://schema.org',
                      '@type': 'BlogPosting',
                      'headline': h1,
                      'description': desc,
                      'url': canonical or DOMAIN + 'blog/' + p.name,
                      'mainEntityOfPage': canonical or DOMAIN + 'blog/' + p.name,
                      'author': {'@type': 'Organization', 'name': BRAND, 'url': DOMAIN},
                      'publisher': {'@type': 'Organization', 'name': BRAND, 'url': DOMAIN, 'logo': {'@type': 'ImageObject', 'url': DOMAIN + 'assets/img/logo.svg'}}
                  }
                  if og_image:
                      article['image'] = og_image
                  text = inject_before_head_close(text, '\n  ' + json_script(article))
              p.write_text(text, encoding='utf-8')

          # 3) Footer consistency: add Padel Rackets link after Pickleball where missing.
          for p in root_html + blog_files:
              text = p.read_text(encoding='utf-8')
              prefix = '../' if p.parent.name == 'blog' else ''
              pick = f'<a href="{prefix}products.html">Pickleball Paddles</a>'
              padel = f'<a href="{prefix}padel.html">Padel Rackets</a>'
              if pick in text and padel not in text:
                  text = text.replace(pick, pick + padel)
              p.write_text(text, encoding='utf-8')

          # 4) Context-aware floating WhatsApp messages on root pages only.
          general_pages = {'index.html','oem.html','technology.html','factory.html','quality.html','about.html','contact.html','case-studies.html','blog.html'}
          for p in root_html:
              text = p.read_text(encoding='utf-8')
              if p.name.startswith('product-padel-') or p.name == 'padel.html':
                  text = text.replace('Hi%20Carbonova%2C%20I%20have%20a%20question%20about%20your%20pickleball%20paddles.', 'Hi%20Carbonova%2C%20I%27d%20like%20to%20discuss%20a%20padel%20racket%20project.')
              elif p.name in general_pages:
                  text = text.replace('Hi%20Carbonova%2C%20I%20have%20a%20question%20about%20your%20pickleball%20paddles.', 'Hi%20Carbonova%2C%20I%27d%20like%20to%20discuss%20an%20OEM%2FODM%20racket%20project.')
              p.write_text(text, encoding='utf-8')

          # 5) Persistent Codex repository rules.
          agents = '''# Carbonova Sports repository rules\n\n- Production domain: https://www.carbonovasports.com/\n- Brand: Carbonova Sports\n- Legal manufacturer: Xiamen Carbon Rock Material Technology Co., Ltd.\n- Keep existing public URLs stable unless an explicit migration/redirect plan is approved.\n- Never invent certifications, certificate IDs, customers, sales volumes, reviews, ratings, prices, SKUs, GTINs, inventory status, or unverified product specifications.\n- Do not change certification data or the WhatsApp number without explicit approval.\n- Preserve the current static HTML/CSS/JS architecture and Carbonova visual design unless redesign is explicitly requested.\n- Technical SEO changes should use a branch + pull request workflow and must not overwrite recent Accio Work content changes.\n- Product structured data may use only facts already present on the page or otherwise explicitly verified.\n- For Product schema, omit Offers/price/reviews/ratings/availability unless verified data exists.\n- Padel and Pickleball are both primary categories; general site metadata should not incorrectly describe Carbonova as pickleball-only.\n'''
          Path('AGENTS.md').write_text(agents, encoding='utf-8')
      - name: Validate generated JSON-LD
        shell: python
        run: |
          import json, re
          from pathlib import Path
          files = list(Path('.').glob('product-*.html')) + list(Path('blog').glob('*.html'))
          count = 0
          for p in files:
              text = p.read_text(encoding='utf-8')
              for raw in re.findall(r'<script type="application/ld\+json">(.*?)</script>', text, re.S):
                  json.loads(raw)
                  count += 1
          print(f'Validated {count} JSON-LD blocks')
      - name: Commit P1 changes and remove one-time workflow
        run: |
          rm -f .github/workflows/p1-seo-once.yml
          git config user.name "Carbonovasports"
          git config user.email "peterxball844@gmail.com"
          git add -A
          git commit -m "P1 SEO: product schemas, breadcrumbs and site consistency"
          git push origin seo/p1-structured-data
