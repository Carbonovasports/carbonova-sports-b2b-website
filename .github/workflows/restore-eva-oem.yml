name: Restore EVA OEM buyer guide

on:
  push:
    branches:
      - feature/eva-oem-padel-buyer-guide

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply existing EVA patch
        env:
          PATCH_B64: "PLACEHOLDER_B64"
        run: |
          python - <<'PY'
          import base64, os
          data = base64.b64decode(os.environ['PATCH_B64'])
          open('/tmp/eva.patch','wb').write(data)
          PY
          git apply --check /tmp/eva.patch
          git apply /tmp/eva.patch

      - name: Commit restored content and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog.html blog/soft-medium-hard-eva-oem-padel-rackets.html sitemap.xml .github/workflows/restore-eva-oem.yml
          git commit -m "content: add EVA OEM padel racket buyer guide"
          git push origin HEAD:feature/eva-oem-padel-buyer-guide
